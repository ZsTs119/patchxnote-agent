version: 2

project_name: patchxnote

builds:
  - id: patchxnote
    main: ./cmd/patchxnote
    binary: patchxnote
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ZsTs119/patchxnote-agent/internal/version.Version={{ .Version }}
      - -X github.com/ZsTs119/patchxnote-agent/internal/version.Commit={{ .Commit }}
      - -X github.com/ZsTs119/patchxnote-agent/internal/version.Date={{ .Date }}

archives:
  - id: direct-binaries
    ids:
      - patchxnote
    formats:
      - binary
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

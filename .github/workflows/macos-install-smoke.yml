name: macOS Install Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published npm/GitHub Release version to install, without leading v"
        required: true
        default: "0.2.6"
        type: string
  pull_request:
    paths:
      - ".github/workflows/macos-install-smoke.yml"
      - "packages/npm/**"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Native keychain integration smoke
        run: go test ./internal/keychain -run TestNativeStoreIntegration -count=1
        env:
          PATCHXNOTE_KEYCHAIN_INTEGRATION: "1"

      - name: Install PatchXNote Agent from npm
        run: |
          set -euo pipefail
          INSTALL_DIR="${RUNNER_TEMP}/patchxnote-agent-bin"
          npx -y --registry https://registry.npmjs.org "patchxnote-agent@${VERSION}" install \
            --install-dir "${INSTALL_DIR}" \
            --print-config
          "${INSTALL_DIR}/patchxnote" version --output json > "${RUNNER_TEMP}/patchxnote-version.json"
          node -e "const fs=require('fs'); const got=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/patchxnote-version.json', 'utf8')); if (got.version !== process.env.VERSION) { throw new Error('unexpected patchxnote version ' + got.version); } if (got.os !== 'darwin') { throw new Error('expected darwin binary, got ' + got.os); }"
        env:
          VERSION: ${{ github.event.inputs.version || '0.2.6' }}

      - name: MCP stdio initialize smoke
        run: |
          set -euo pipefail
          INSTALL_DIR="${RUNNER_TEMP}/patchxnote-agent-bin"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | "${INSTALL_DIR}/patchxnote" mcp serve > "${RUNNER_TEMP}/patchxnote-mcp.jsonl"
          node -e "const fs=require('fs'); const lines=fs.readFileSync(process.env.RUNNER_TEMP + '/patchxnote-mcp.jsonl', 'utf8').trim().split(/\n+/).map(JSON.parse); if (lines.length !== 2) { throw new Error('expected 2 MCP responses'); } if (lines.some(line => line.error)) { throw new Error('unexpected MCP error ' + JSON.stringify(lines)); } const tools=lines[1].result.tools || []; if (tools.length !== 19) { throw new Error('expected 19 tools, got ' + tools.length); }"
